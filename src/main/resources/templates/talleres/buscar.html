<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('MiTaller - Buscar talleres')}"></head>
<body class="d-flex flex-column min-vh-100">

<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4 flex-grow-1">
    <h2 class="mb-4"><i class="bi bi-search"></i> Buscar talleres</h2>

    <!-- Filtros -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form action="/buscar" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Localidad</label>
                    <select name="localidad" class="form-select">
                        <option value="">Todas</option>
                        <option th:each="loc : ${localidades}" th:value="${loc}" th:text="${loc}"
                                th:selected="${loc == localidadSeleccionada}">Localidad</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Especialidad</label>
                    <select name="especialidad" class="form-select">
                        <option value="">Todas</option>
                        <option th:each="esp : ${especialidades}" th:value="${esp.name()}" th:text="${esp.displayName}"
                                th:selected="${esp.name() == especialidadSeleccionada}">Especialidad</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small">Buscar por nombre</label>
                    <input type="text" name="q" class="form-control" placeholder="Nombre del taller..."
                           th:value="${query}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Resultados -->
    <p class="text-muted" th:text="${#lists.size(talleres)} + ' talleres encontrados'">0 talleres encontrados</p>

    <div th:if="${#lists.isEmpty(talleres)}" class="text-center py-5">
        <i class="bi bi-emoji-frown display-1 text-muted"></i>
        <h4 class="mt-3">No se encontraron talleres</h4>
        <p class="text-muted">Prueba con otros filtros de búsqueda</p>
    </div>

    <div class="row g-3">
        <div th:each="taller : ${talleres}" class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-8">
                            <h5 class="card-title mb-1">
                                <a th:href="@{/talleres/{id}(id=${taller.id})}" th:text="${taller.nombre}"
                                   class="text-decoration-none">Taller</a>
                            </h5>
                            <p class="text-muted mb-1">
                                <i class="bi bi-geo-alt"></i>
                                <span th:text="${taller.direccion + ', ' + taller.localidad}">Dirección</span>
                            </p>
                            <p class="mb-2">
                                <span class="text-warning">
                                    <i th:each="i : ${#numbers.sequence(1,5)}"
                                       th:class="${i <= taller.valoracionMedia} ? 'bi bi-star-fill' : 'bi bi-star'"></i>
                                </span>
                                <small class="text-muted" th:text="'(' + ${taller.numeroResenas} + ' reseñas)'">
                                    (0 reseñas)
                                </small>
                            </p>
                            <div>
                                <span th:each="esp : ${taller.especialidades}"
                                      class="badge bg-primary bg-opacity-10 text-primary me-1 mb-1"
                                      th:text="${esp.nombre.displayName}">Especialidad</span>
                            </div>
                        </div>
                        <div class="col-md-4 text-end d-flex flex-column justify-content-center">
                            <p class="mb-1 text-muted small">
                                <i class="bi bi-telephone"></i>
                                <span th:text="${taller.telefono}">Teléfono</span>
                            </p>
                            <p class="mb-2 text-muted small">
                                <i class="bi bi-clock"></i>
                                <span th:text="${taller.horario}">Horario</span>
                            </p>
                            <a th:href="@{/talleres/{id}(id=${taller.id})}" class="btn btn-outline-primary btn-sm">
                                Ver ficha <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
