<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin - Taller - MiTaller')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4 flex-grow-1">

  <h2 class="mb-4">
    <i class="bi bi-gear"></i>
    <span th:text="${taller.id == null ? 'Nuevo Taller' : 'Editar Taller'}"></span>
  </h2>

  <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>

  <form th:action="${taller.id == null ? '/admin/talleres/guardar' : '/admin/talleres/' + taller.id + '/actualizar'}"
        method="post">

    <div class="mb-3">
      <label class="form-label">Nombre *</label>
      <input type="text" class="form-control" name="nombre"
             th:value="${taller.nombre}" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Descripción *</label>
      <textarea class="form-control" name="descripcion"
                rows="3" required th:text="${taller.descripcion}"></textarea>
    </div>

    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Dirección *</label>
        <input type="text" class="form-control" name="direccion"
               th:value="${taller.direccion}" required>
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Localidad *</label>
        <input type="text" class="form-control" name="localidad"
               th:value="${taller.localidad}" required>
      </div>
      <div class="col-md-2 mb-3">
        <label class="form-label">Código Postal</label>
        <input type="text" class="form-control" name="codigoPostal"
               th:value="${taller.codigoPostal}">
      </div>
    </div>

    <div class="row">
      <div class="col-md-4 mb-3">
        <label class="form-label">Teléfono</label>
        <input type="text" class="form-control" name="telefono"
               th:value="${taller.telefono}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" name="email"
               th:value="${taller.email}">
      </div>
      <div class="col-md-4 mb-3">
        <label class="form-label">Horario</label>
        <input type="text" class="form-control" name="horario"
               th:value="${taller.horario}">
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Especialidades</label>
      <div class="row">
        <div class="col-md-4 mb-2"
             th:each="esp : ${especialidades}">
          <div class="form-check">
            <input class="form-check-input" type="checkbox"
                   name="especialidades"
                   th:value="${esp.name()}"
                   th:id="${esp.name()}"
                   th:checked="${taller.id != null AND taller.especialidades != null AND taller.especialidades.![nombre.name()].contains(esp.name())}">
            <label class="form-check-label"
                   th:for="${esp.name()}"
                   th:text="${esp.displayName}">
            </label>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="bi bi-save"></i>
        <span th:text="${taller.id == null ? 'Crear Taller' : 'Guardar Cambios'}"></span>
      </button>
      <a href="/admin/talleres" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Cancelar
      </a>
    </div>

  </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
