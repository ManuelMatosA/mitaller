<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('MiTaller - Registro')}"></head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <h1 class="fw-bold"><i class="bi bi-wrench-adjustable-circle text-primary"></i> MiTaller</h1>
                <p class="text-muted">Crea tu cuenta</p>
            </div>
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="card-title mb-3">Registro</h4>
                    <div th:if="${error}" class="alert alert-danger"><i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span></div>
                    <form th:action="@{/registro}" method="post">
                        <div class="row g-2 mb-3">
                            <div class="col-6">
                                <label class="form-label">Nombre</label>
                                <input type="text" class="form-control" name="nombre" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Apellidos</label>
                                <input type="text" class="form-control" name="apellidos">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" class="form-control" name="username" required minlength="3">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" class="form-control" name="password" required minlength="6">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mb-3"><i class="bi bi-person-plus"></i> Crear cuenta</button>
                    </form>
                    <div class="text-center"><small class="text-muted">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></small></div>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
