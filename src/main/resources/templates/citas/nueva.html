<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Pedir cita - MiTaller')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4 flex-grow-1">
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Inicio</a></li>
            <li class="breadcrumb-item"><a th:href="@{/talleres/{id}(id=${taller.id})}" th:text="${taller.nombre}">Taller</a></li>
            <li class="breadcrumb-item active">Pedir cita</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="mb-1"><i class="bi bi-calendar-plus text-success"></i> Solicitar cita</h4>
                    <p class="text-muted mb-4">en <strong th:text="${taller.nombre}">Taller</strong>
                        — <span th:text="${taller.localidad}">Localidad</span></p>

                    <form th:action="@{/talleres/{id}/cita(id=${taller.id})}" method="post">
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Fecha</label>
                                <input type="date" name="fecha" class="form-control" th:min="${fechaMinima}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Hora</label>
                                <select name="hora" class="form-select" required>
                                    <option value="">Selecciona hora</option>
                                    <option value="08:00">08:00</option>
                                    <option value="08:30">08:30</option>
                                    <option value="09:00">09:00</option>
                                    <option value="09:30">09:30</option>
                                    <option value="10:00">10:00</option>
                                    <option value="10:30">10:30</option>
                                    <option value="11:00">11:00</option>
                                    <option value="11:30">11:30</option>
                                    <option value="12:00">12:00</option>
                                    <option value="12:30">12:30</option>
                                    <option value="13:00">13:00</option>
                                    <option value="15:00">15:00</option>
                                    <option value="15:30">15:30</option>
                                    <option value="16:00">16:00</option>
                                    <option value="16:30">16:30</option>
                                    <option value="17:00">17:00</option>
                                    <option value="17:30">17:30</option>
                                    <option value="18:00">18:00</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tipo de servicio</label>
                            <select name="tipoServicio" class="form-select" required>
                                <option value="">Selecciona servicio</option>
                                <option value="Revisión general">Revisión general</option>
                                <option value="Cambio de aceite y filtros">Cambio de aceite y filtros</option>
                                <option value="Frenos">Frenos</option>
                                <option value="Neumáticos">Neumáticos</option>
                                <option value="Pre-ITV">Pre-ITV</option>
                                <option value="Electricidad">Electricidad</option>
                                <option value="Aire acondicionado">Aire acondicionado</option>
                                <option value="Chapa y pintura">Chapa y pintura</option>
                                <option value="Diagnosis">Diagnosis</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Describe el problema (opcional)</label>
                            <textarea name="descripcionProblema" class="form-control" rows="3"
                                      placeholder="Ej: Hace un ruido raro al frenar, el motor se calienta..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100">
                            <i class="bi bi-check-circle"></i> Solicitar cita
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
