<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis citas - MiTaller')}"></head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container py-4 flex-grow-1">
    <h2 class="mb-4"><i class="bi bi-calendar-check"></i> Mis citas</h2>

    <div th:if="${mensaje}" class="alert alert-success"><i class="bi bi-check-circle"></i> <span th:text="${mensaje}"></span></div>

    <div th:if="${#lists.isEmpty(citas)}" class="text-center py-5">
        <i class="bi bi-calendar-x display-1 text-muted"></i>
        <h4 class="mt-3">No tienes citas todavía</h4>
        <p class="text-muted">Busca un taller y solicita tu primera cita</p>
        <a href="/buscar" class="btn btn-primary">Buscar talleres</a>
    </div>

    <div class="row g-3">
        <div th:each="cita : ${citas}" class="col-12">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="row align-items-center">
                        <div class="col-md-3">
                            <h6 class="mb-0" th:text="${cita.taller.nombre}">Taller</h6>
                            <small class="text-muted" th:text="${cita.taller.localidad}">Localidad</small>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Fecha</small><br>
                            <strong th:text="${#temporals.format(cita.fecha, 'dd/MM/yyyy')}">01/01/2026</strong>
                        </div>
                        <div class="col-md-2">
                            <small class="text-muted">Hora</small><br>
                            <strong th:text="${cita.hora}">09:00</strong>
                        </div>
                        <div class="col-md-3">
                            <small class="text-muted">Servicio</small><br>
                            <span th:text="${cita.tipoServicio}">Revisión</span>
                        </div>
                        <div class="col-md-2 text-end">
                            <span class="badge"
                                  th:classappend="${cita.estado.name() == 'PENDIENTE'} ? 'bg-warning text-dark' :
                                                 (${cita.estado.name() == 'CONFIRMADA'} ? 'bg-success' :
                                                 (${cita.estado.name() == 'CANCELADA'} ? 'bg-danger' : 'bg-info'))"
                                  th:text="${cita.estado.displayName}">Estado</span>
                        </div>
                    </div>
                    <div th:if="${cita.descripcionProblema != null and !cita.descripcionProblema.isBlank()}" class="mt-2">
                        <small class="text-muted">Descripción: <span th:text="${cita.descripcionProblema}">...</span></small>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
